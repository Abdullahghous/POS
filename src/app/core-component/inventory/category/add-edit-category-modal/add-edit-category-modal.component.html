    <div class="modal-header border-0 custom-modal-header">
        <div class="page-title">
            <h4>{{ !data.isEdit ? 'Add Category' : 'Update Category' }}</h4>
        </div>
        <button type="button" class="close" aria-label="Close" (click)="closeModal()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div>

        <form [formGroup]="formGroup">
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input formControlName="name" type="text" placeholder="Type Category Name" class="form-control">
            </div>
            <div class="mb-0">
                <div class="modal-status d-flex justify-content-between align-items-center">
                    <span class="status-label">Status</span>
                    <label formControlName="active" nz-checkbox></label>
                </div>
            </div>
        </form>

    </div>

    <div class="modal-footer-btn mb-2 mr-1">
        <button type="button" class="btn btn-cancel me-2" (click)="closeModal()">Cancel</button>
        @if (!data.isEdit) {
        <button type="submit" class="btn btn-submit" (click)="addDetails()">Create Category</button>
        } @else {
        <button type="submit" class="btn btn-submit" (click)="updateDetails()">Update Category</button>
        }
    </div>
</div>
