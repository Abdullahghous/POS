<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>Edit Product</h4>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <div class="page-btn">
        <a [routerLink]="routes.productList" class="btn btn-secondary"><i class="feather icon-arrow-left me-2"></i>Back
      to Product</a>
    </div>
  </li>
  <li>
    <a data-bs-toggle="tooltip" data-bs-placement="top" id="collapse-header" (click)="toggleCollapse()" matTooltip="Collapse"
      matTooltipPosition="above"> @if (!isCollapsed) {
      <i class="feather icon-chevron-up feather-chevron-up"></i>
    }
    @if (isCollapsed) {
      <i class="feather icon-chevron-down feather-chevron-down"></i>
    }</a>
  </li>
</ul>

</div>

<form class="pb-2">
  <div class="card mb-0">
    <div class="card-body add-product pb-0">
      <form [formGroup]="formGroup">
        <div class="accordion-card-one accordion" id="accordionExample">
          <div class="accordion-item">
            <div class="accordion-header" id="headingOne">
              <div class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapseOne"
                aria-controls="collapseOne">
                <div class="addproduct-icon">
                  <h5>
                    <i class="feather icon-info add-info"></i><span>Product Information</span>
                  </h5>
                  <a href="javascript:void(0);"><i class="feather icon-chevron-down chevron-down-add"></i></a>
                </div>
              </div>
            </div>
            <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
              data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <div class="addservice-info">
                  <div class="row">
  
                    <div class="col-lg-8 col-sm-6 col-12">
                      <div class="input-blocks add-product">
                        <label>Product Name <span class="required-span-color">*</span></label>
                        <input formControlName="productName" nz-input placeholder="Type product name" nzSize="large" />
                      </div>
                    </div>
  
                    <div class="col-lg-4 col-sm-6 col-12">
                      <div class="mb-3 add-product">
                        <div class="add-newplus">
                          <label class="form-label" >Brand</label>
                        </div>
                        <nz-select formControlName="brand" class="w-100" nzShowSearch nzAllowClear nzPlaceHolder="Select Brand">
                          <nz-option *ngFor="let b of allBrands" [nzLabel]="b.name" [nzValue]="b.id"></nz-option>
                        </nz-select>
                      </div>
                    </div>
  
                  </div>
                </div>
                <div class="row">
  
                  <div class="col-lg-4 col-sm-6 col-12">
                    <div class="add-newplus">
                      <label class="form-label">Category</label>
                    </div>
                    <nz-select formControlName="category" class="w-100" nzShowSearch nzAllowClear nzPlaceHolder="Select Category" (ngModelChange)="onChangeCatgory($event)">
                      <nz-option *ngFor="let c of allCategory" [nzLabel]="c.name" [nzValue]="c.code"></nz-option>
                    </nz-select>
                  </div>
  
                  <div class="col-lg-4 col-sm-6 col-12">
                    <div class="mb-3 add-product">
                      <label class="form-label">Sub Category</label>
                      <nz-select formControlName="subCategory" allSubCategory class="w-100" nzShowSearch nzAllowClear nzPlaceHolder="Select Sub Category">
                        <nz-option *ngFor="let sc of allSubCategory" [nzLabel]="sc.name" [nzValue]="sc.id"></nz-option>
                      </nz-select>
                    </div>
                  </div>
                  
                  <div class="col-lg-4 col-sm-6 col-12">
                    <div class="input-blocks add-product">
                      <label>Unit <span class="required-span-color">*</span></label>
                      <nz-select formControlName="unit"  id class="w-100" nzShowSearch nzAllowClear nzPlaceHolder="Select Unit">
                        <nz-option *ngFor="let u of allUnits" [nzLabel]="u.baseName" [nzValue]="u.id"></nz-option>
                      </nz-select>
                    </div>
                  </div>
  
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="accordion-card-one accordion" id="accordionExample2">
          <div class="accordion-item">
            <div class="accordion-header" id="headingTwo">
              <div class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapseTwo"
                aria-controls="collapseTwo">
                <div class="text-editor add-list">
                  <div class="addproduct-icon list icon">
                    <h5>
                      <i class="feather icon-life-buoy add-info"></i><span>Pricing & Stocks</span>
                    </h5>
                    <a href="javascript:void(0);"><i class="feather icon-chevron-down chevron-down-add"></i></a>
                  </div>
                </div>
              </div>
            </div>
            <div id="collapseTwo" class="accordion-collapse collapse show" aria-labelledby="headingTwo"
              data-bs-parent="#accordionExample2">
              <div class="accordion-body">
                <div class="tab-content" id="pills-tabContent">
                  <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
                    <div class="row">
                      <div class="col-lg-4 col-sm-6 col-12">
                        <div class="input-blocks add-product">
                          <label>Buying Price <span class="required-span-color">*</span></label>
                          <input formControlName="buyingPrice" nz-input placeholder="Type Buying Price" nzSize="large" />
                        </div>
                      </div>
  
                      <div class="col-lg-4 col-sm-6 col-12">
                        <div class="input-blocks add-product">
                          <label>Selling Price <span class="required-span-color">*</span></label>
                          <input formControlName="sellingPrice" nz-input placeholder="Type Selling Price" nzSize="large" />
                        </div>
                      </div>
  
                      <div class="col-lg-4 col-sm-6 col-12">
                        <div class="input-blocks add-product">
                          <label>Quantity Alert</label>
                          <input formControlName="quantityAlert" nz-input placeholder="Type quantity alert" nzSize="large" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="col-lg-12">
      <div class="btn-addproduct mb-4">
        <button type="button" class="btn btn-cancel me-2">Cancel</button>
        <button type="submit" class="btn btn-submit" (click)="onEdit()">Updated Product</button>
      </div>
    </div>
  </div>

</form>
