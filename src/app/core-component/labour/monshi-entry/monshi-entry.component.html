<div class="page-header">
    <div class="add-item d-flex">
        <div class="page-title">
          <h4>Monshies List</h4>
          <h6>Manage Your monshi</h6>
        </div>
      </div>
      <ul class="table-top-head">
        <li>
          <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Pdf" matTooltipPosition="above"><img
          src="assets/img/icons/pdf.svg" alt="img"></a>
        </li>
        <li>
          <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Excel" matTooltipPosition="above"><img
          src="assets/img/icons/excel.svg" alt="img"></a>
        </li>
        <li>
          <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Print" matTooltipPosition="above"><i
          class="feather icon-rotate-ccw feather-rotate-ccw"></i></a>
        </li>
        <li>
          <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Refresh" matTooltipPosition="above"><i
          class="feather icon-rotate-ccw feather-rotate-ccw"></i></a>
        </li>
        <li>
          <a (click)="toggleCollapse()" data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Collapse"
            matTooltipPosition="above" id="collapse-header"> @if (!isCollapsed) {
            <i class="feather icon-chevron-up feather-chevron-up"></i>
          }
          @if (isCollapsed) {
            <i class="feather icon-chevron-down feather-chevron-down"></i>
          }</a>
        </li>
      </ul>
      <div class="page-btn">
        <a href="javascript:void(0);" class="btn btn-added" data-bs-toggle="modal" data-bs-target="#add-sales-new"><i
        class="feather icon-plus-circle me-2"></i> Add New Monshi</a>
      </div>
</div>
<div  class="card table-list-card">
     <div class="table-responsive">
            <nz-table #ITableRef [nzData]="['*']" [nzFrontPagination]="false" class="table datanew" >
                <thead>
                    <tr>
                        <th>#</th>
                        <th>NAME</th>
                        <th>ADDRESS</th>
                        <th>PHONE NO</th>
                        <th style="width: 10%;">ACCTION</th>
                    </tr>
                </thead>
                  <tbody>
                      <tr *ngFor="let m of monshiList; let i=index">
                            <td>{{i+1}}</td>
                            <td>{{m.name}}</td>
                            <td>{{m.address}}</td>
                            <td>{{m.mobile}}</td>
                           <td> <a href="javascript:void(0);" (click)="editMunshi(m)" class="dropdown-item" data-bs-toggle="modal"
                            data-bs-target="#edit-sales-new"><i class="feather icon-edit info-img"></i>Edit
                          Monshi</a></td>
                       </tr>
                  </tbody>   
            </nz-table>
    </div>
</div>
 
<!-- <model> -->
    <!-- <div class="modal fade" id="add-sales-new"> -->
  <div class="modal fade" id="add-sales-new" tabindex="-1" aria-labelledby="editpayment" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 custom-modal-header">
          <div class="page-title">
            <h4>ADD Monshi</h4>
          </div>
          <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body custom-modal-body">
          <form>
            <div class="row">
              <div class="col-lg-4 col-sm-6 col-12">
                <div class="input-blocks add-product">
                  <label>NAME <span class="required-span-color">*</span></label>
                  <input type="text" class="form-control" 
                  [(ngModel)]="obj.name" [ngModelOptions]="{standalone: true}"  />
                </div>
              </div>
               <div class="col-lg-4 col-sm-6 col-12">
                <div class="input-blocks add-product">
                  <label>ADDRESS <span class="required-span-color">*</span></label>
                  <input type="text" class="form-control" 
                  [(ngModel)]="obj.address" [ngModelOptions]="{standalone: true}"  />
                </div>
              </div>
              <div class="col-lg-4 col-sm-6 col-12">
                <div class="input-blocks add-product">
                  <label>PHONE No <span class="required-span-color">*</span></label>
                  <input type="text" class="form-control" 
                  [(ngModel)]="obj.mobile" [ngModelOptions]="{standalone: true}"  />
                </div>
              </div>
            </div>
            <div class="col-lg-12 text-end">
              <button type="button" class="btn btn-cancel add-cancel me-3"
              data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-submit add-sale" (click)="addMunshi()" >Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
