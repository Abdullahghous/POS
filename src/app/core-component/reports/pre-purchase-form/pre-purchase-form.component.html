<div class="page-header">
    <div class="add-item d-flex">
      <div class="page-title">
        <h4>New Order</h4>
        <h6>Create new pre purchase</h6>
      </div>
    </div>
    <ul class="table-top-head">
      <li>
        <div class="page-btn">
          <a [routerLink]="routes.prePurchaseReport" class="btn btn-secondary"><i class="feather icon-arrow-left me-2"></i>Back
            to Pre Purchase Report</a>
        </div>
      </li>
      <li>
        <a (click)="toggleCollapse()" data-bs-toggle="tooltip" data-bs-placement="top" title="Collapse"
          id="collapse-header" matTooltip="Collapse"> @if (!isCollapsed) {
          <i class="feather icon-chevron-up feather-chevron-up"></i>
          }
          @if (isCollapsed) {
          <i class="feather icon-chevron-down feather-chevron-down"></i>
          }</a>
      </li>
    </ul>
  </div>


  <div class="card table-list-card">
    <div class="card-body">
        <div class="table-top"> 
            <div class="card-body pb-0">
                <div class="row">
                    <div class="col-lg-4 col-sm-6 col-12">
                        <div class="input-blocks add-product">
                            <label>Company <span class="required-span-color">*</span></label>
                            <nz-select
                                [(ngModel)]="pre.company.id"
                                [ngModelOptions]="{ standalone: true }"
                                class="w-100 "
                                nzShowSearch
                                nzAllowClear
                                nzPlaceHolder="Select Unit"
                            >
                                <nz-option *ngFor="let c of getCompanies" [nzLabel]="c.name" [nzValue]="c.id"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                    <div class="col-lg-4 col-sm-6 col-12">
                        <div class="input-blocks add-product">
                            <label>Branch <span class="required-span-color">*</span></label>
                            <nz-select
                                [(ngModel)]="pre.branch.id"
                                [ngModelOptions]="{ standalone: true }"
                                class="w-100 "
                                nzShowSearch
                                nzAllowClear
                                nzPlaceHolder="Select Branch"
                            >
                                <nz-option *ngFor="let u of getBranches" [nzLabel]="u.name" [nzValue]="u.id"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                    <div class="col-lg-4 col-sm-6 col-12">
                        <div class="input-blocks add-product">
                            <label>Financial Year <span class="required-span-color">*</span></label>
                            <nz-select
                                [(ngModel)]="pre.financialYear.id"
                                [ngModelOptions]="{ standalone: true }"
                                class="w-100 "
                                nzShowSearch
                                nzAllowClear
                                nzPlaceHolder="Select Year"
                            >
                                <nz-option *ngFor="let f of financialYear" [nzLabel]="f.name" [nzValue]="f.id"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                </div>
            </div>
        </div>   
        <div class="table-responsive">
            <table class="table datanew table-styled">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>PPVN <br>DATE</th>
                        <th style="width: 15%;">ITEM</th>
                        <th>ACCOUNT <br>MILL</th>
                        <th>TRUCK <br>BAGS <br>P TYPE</th>
                        <th>WEIGHT <br> FRIGHT <br>RATE</th>
                        <th>ATTACHMENTS <br>REMARKS</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody class="sales-list">
                    <tr *ngFor="let data of pre.prePurchaseEntries; let i = index">
                        <td><span>{{i + 1}}</span></td>
                        <td>
                            <input class="form-control border-dark input-field" type="text">
                            <br>
                            <input class="form-control border-dark input-field" type="date">
                        </td>
                        <td style="width: 15%;">
                            <nz-select  class="w-100" [(ngModel)]="data.itemDef" [ngModelOptions]="{standalone: true}">
                                <nz-option *ngFor="let p of itemDefs" [nzLabel]="p.name" [nzValue]="p.id"></nz-option>
                            </nz-select>
                        </td>
                        <td style="width: 15%;">
                            <nz-select class="w-100" [(ngModel)]="data.supplierAccount.code" [ngModelOptions]="{standalone: true}">
                                <nz-option *ngFor="let p of parties" [nzLabel]="p.accountName" [nzValue]="p.code"></nz-option>
                            </nz-select>
                            <br><br>
                            <nz-select class="w-100 " [(ngModel)]="data.millKhata.id" [ngModelOptions]="{standalone: true}">
                                <nz-option *ngFor="let m of mills" [nzLabel]="m.accountName" [nzValue]="m.id"></nz-option>
                            </nz-select>
                        </td>
                        <td>
                            <input class="form-control border-dark input-field" type="text" [(ngModel)]="data.vehical">
                            <br>
                            <input class="form-control border-dark input-field" type="text" [(ngModel)]="data.bag">
                            <br>
                            <mat-select class="w-100 " [(ngModel)]="data.paymentType">
                                <mat-option value="routine">Routine</mat-option>
                                <mat-option value="cash">Cash</mat-option>
                                <mat-option value="percentage">Percentage</mat-option>
                            </mat-select>
                        </td>
                        <td>
                            <input class="form-control border-dark input-field" type="text" [(ngModel)]="data.kg">
                            <br>
                            <input class="form-control border-dark input-field" type="text" [(ngModel)]="data.freight">
                            <br>
                            <input class="form-control border-dark input-field" type="text" [(ngModel)]="data.rate">
                        </td>
                        <td>
                            <input class="form-control border-dark input-field" type="text" [(ngModel)]="data.remarks">
                        </td>
                        <td >
                            <div class="edit-delete-action">
                                <a href="javascript:void(0);" class="btn btn-added" (click)="addNewRow(data, i)">
                                    <i class="feather icon-plus-circle me-2"></i>
                                </a>
                                <a class="confirm-text p-2" href="javascript:void(0);" (click)="deleteRow(i)" style="color: red;">
                                    <i class="feather icon-trash-2 feather-trash-2"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="col-lg-12 text-end">
                <button type="button" id="cancelButton" class="btn btn-cancel add-cancel me-3" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-submit add-sale" (click)="onSave()">Submit</button>
            </div>
        </div>
    </div>
</div>
