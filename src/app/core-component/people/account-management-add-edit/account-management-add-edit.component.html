<div class="page-header">
    <div class="add-item d-flex">
        <div class="page-title">
            <h4>Account Management</h4>
            <h6>Create new Account</h6>
        </div>
    </div>
    <ul class="table-top-head">
        <li>
            <div class="page-btn">
                <a [routerLink]="routes.accountManagementLevels" class="btn btn-secondary"><i
                        class="feather icon-arrow-left me-2"></i>Back
                    to Account List</a>
            </div>
        </li>
        <li>
            <a (click)="toggleCollapse()" data-bs-toggle="tooltip" data-bs-placement="top" title="Collapse"
                id="collapse-header" matTooltip="Collapse"> @if (!isCollapsed) {
                <i class="feather icon-chevron-up feather-chevron-up"></i>
                }
                @if (isCollapsed) {
                <i class="feather icon-chevron-down feather-chevron-down"></i>
                }</a>
        </li>
    </ul>
</div>

<form class="pb-2">
    <div class="card mb-0">
        <div class="card-body add-product pb-0">

            <div>
                <h4>Account Levels</h4>
                <hr />
            </div>

            <form [formGroup]="formGroupLevels">
                <div class="level-box">
                    <div class="row">
                        <div class="col-lg-6 col-sm-6 col-12">
                            <div class="add-newplus">
                                <label class="form-label">Level One</label>
                            </div>
                            <nz-select formControlName="levelOne" class="w-100" nzShowSearch nzAllowClear
                                nzPlaceHolder="Select Level One" (ngModelChange)="onChangeLevelOne($event)">
                                <nz-option *ngFor="let l1 of levelOneData" [nzLabel]="l1.name" [nzValue]="l1.code"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6 col-sm-6 col-12">
                            <div class="add-newplus">
                                <label class="form-label">Level Two</label>
                            </div>
                            <nz-select formControlName="levelTwo" class="w-100" nzShowSearch nzAllowClear
                                nzPlaceHolder="Select Level Two" (ngModelChange)="onChangeLevelTwo($event)">
                                <nz-option *ngFor="let l2 of levelTwoData" [nzLabel]="l2.name" [nzValue]="l2.code"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6 col-sm-6 col-12">
                            <div class="add-newplus level-add-edit-box">
                                <div>
                                    <label class="form-label">Level Three</label>
                                </div>
                                <div class="mb-2">
                                    <button type="submit" class="btn-level btn-submit">Add</button>
                                    <button type="submit" class="btn-level btn-submit ml-2">Edit</button>
                                </div>
                            </div>
                            <nz-select formControlName="levelThree" class="w-100" nzShowSearch nzAllowClear
                                nzPlaceHolder="Select Level Three" (ngModelChange)="onChangeLevelThree($event)">
                                <nz-option *ngFor="let l3 of levelThreeData" [nzLabel]="l3.name" [nzValue]="l3.code"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6 col-sm-6 col-12">
                            <div class="add-newplus">
                                <div>
                                    <label class="form-label">Level Four</label>
                                </div>
                                <div class="mb-2">
                                    <button type="submit" class="btn-level btn-submit">Add</button>
                                    <button type="submit" class="btn-level btn-submit ml-2">Edit</button>
                                </div>
                            </div>
                            <nz-select formControlName="levelFour" class="w-100" nzShowSearch nzAllowClear
                                nzPlaceHolder="Select Level Four" (ngModelChange)="onChangeLevelFour($event)">
                                <nz-option *ngFor="let l4 of levelFourData" [nzLabel]="l4.name" [nzValue]="l4.code"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                </div>
            </form>





        </div>
        <div class="col-lg-12">
            <div class="btn-addproduct mb-4">
                <!-- <button type="button" class="btn btn-cancel me-2">Cancel</button> -->
                <button type="submit" class="btn btn-submit" (click)="onSave()">Save Product</button>
            </div>
        </div>
    </div>

</form>
